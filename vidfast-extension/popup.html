<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 350px; font-family: sans-serif; padding: 15px; }
        textarea { 
            width: 100%; 
            height: 100px; 
            font-family: monospace; 
            font-size: 11px; 
            margin-top: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h3>M3U8 Sniffer</h3>
    <div id="status">Waiting for network...</div>
    
    <textarea id="url_display" readonly placeholder="Link will appear here..."></textarea>
    <button id="copy_btn">Copy Link</button>
    
    <script src="popup.js"></script>
</body>
</html>
